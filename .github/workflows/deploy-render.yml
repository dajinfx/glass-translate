name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - "glass-translate-server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy via Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl --fail --show-error --silent --max-time 60 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Render deploy triggered."
      - name: Skip (no hook configured)
        if: ${{ secrets.RENDER_DEPLOY_HOOK == '' }}
        run: |
          echo "RENDER_DEPLOY_HOOK secret is not set — skipping auto-deploy."
          echo "Add it under GitHub repo Settings → Secrets → Actions."
